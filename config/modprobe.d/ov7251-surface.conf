# Brighter IR mode: VTS 3448 -> 15 fps, exposure ceiling 3192 lines (~1.8x).
#
# Measured 1.78x more signal than the stock 30 fps mode: with the illuminator
# lighting the whole integration window, mean level is linear in exposure
# lines, so the only lever is a longer frame. Remove this line to go back to
# the stock 30 fps timing -- surface-ir-bridge reads the exposure range and
# the nominal frame period off the driver at start-up, so nothing else has to
# change either way.
#
# CAVEAT (do not blame the sensor): a share of STREAMONs comes up wedged --
# almost every row pinned at 1023, sometimes absurd frame pacing. The rate
# drifts with the time of day (~3% in the morning, 25-35% in the afternoon,
# ~50% at night) and is INDEPENDENT of VTS; the root cause is the IPU6's
# CSI-2 D-PHY losing sync at stream start (DPHY fatal / SOT sync errors from
# the first frame), not the ov7251. surface-ir-bridge detects it on the first
# frames and restarts the session (0.5-2 s extra), falling back to the stock
# vertical blanking after 8 attempts. See docs/REBUILD.es.md section 11.
#
# Other parameter of the ov7251-surface DKMS module: win_timing=1 selects the
# Windows Hello vendor timing (VTS 522, ~132 fps) -- DO NOT USE, it is 2.4x
# darker at equal gain.
options ov7251 vts_boost=3448
